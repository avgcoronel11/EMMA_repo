<div class="card">
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Estado</th>
          <th class="w-1"></th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            <td>{{ row.nombre|default:row.name|default:row.codigo|default:"Sin nombre" }}</td>
            <td>{{ row.estado|default:row.status|default:"-" }}</td>
            <td>
              <button class="btn btn-icon" type="button" aria-label="Ver detalle">
                <span class="text-secondary">...</span>
              </button>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3" class="text-secondary">{{ empty_message }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
