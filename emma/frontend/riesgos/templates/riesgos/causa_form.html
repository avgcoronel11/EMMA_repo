{% extends "base.html" %}{% block content %}{% include "components/alerts.html" %}<form class="card" method="post" action="{% url 'riesgos:causas-create' %}" data-riesgos-loading>{% csrf_token %}<div class="card-header"><h1 class="card-title">Nueva Causa</h1></div><div class="card-body">{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><div class="card-footer"><button class="btn btn-primary">Crear</button></div></form>{% endblock %}
